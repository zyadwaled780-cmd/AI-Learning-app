name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Format, Analyze, Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Flutter Web release
        run: flutter build web --release --no-web-resources-cdn

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web for GitHub Pages
        run: flutter build web --release --no-web-resources-cdn --base-href=/project-1/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android Release APK
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Android SDK path
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"

      - name: Cache Android NDK and CMake
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_SDK_PATH }}/ndk/28.2.13676358
            ${{ env.ANDROID_SDK_PATH }}/cmake/3.22.1
          key: ${{ runner.os }}-android-ndk-28.2.13676358-cmake-3.22.1

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android NDK and CMake with retry
        run: |
          SDK_ROOT="${ANDROID_SDK_PATH}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          NDK_MARKER="$SDK_ROOT/ndk/28.2.13676358/source.properties"
          CMAKE_DIR="$SDK_ROOT/cmake/3.22.1"

          for attempt in 1 2 3; do
            if [ -f "$NDK_MARKER" ] && [ -d "$CMAKE_DIR" ]; then
              echo "Android NDK 28.2.13676358 and CMake 3.22.1 already available."
              exit 0
            fi

            echo "Attempt $attempt/3: installing ndk;28.2.13676358 and cmake;3.22.1..."
            rm -rf "$SDK_ROOT/.downloadIntermediates" "$SDK_ROOT/ndk/.installer" "$SDK_ROOT/cmake/.installer"
            yes | timeout 180 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            if yes | timeout 300 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;28.2.13676358" "cmake;3.22.1"; then
              if [ -f "$NDK_MARKER" ] && [ -d "$CMAKE_DIR" ]; then
                echo "Android NDK 28.2.13676358 and CMake 3.22.1 installed."
                exit 0
              fi
            fi

            echo "Attempt $attempt failed or timed out; cleaning partial installs before retry..."
            rm -rf \
              "$SDK_ROOT/.downloadIntermediates" \
              "$SDK_ROOT/ndk/.installer" \
              "$SDK_ROOT/ndk/28.2.13676358" \
              "$SDK_ROOT/cmake/.installer" \
              "$SDK_ROOT/cmake/3.22.1"
            sleep 5
          done

          echo "Failed to install Android NDK and CMake after 3 attempts." >&2
          exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses >/dev/null || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ai-automation-hero-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
